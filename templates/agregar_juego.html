{% extends "maestra.html" %}
{% block titulo %} Agregar juego {% endblock %}
{% block contenido %}
<section class="section"><div class="columns"><div class="column"><h3 class="is-size-3">Agregar juego</h3><form action="{{url_for('guardar_juego')}}" method="post"><label for="nombre">Nombre:</label><input required type="text" class="input" name="nombre" id="nombre"><label for="descripcion" class="mt-2">Descripción:</label><input required type="text" class="input" name="descripcion" id="descripcion"><label for="precio" class="mt-2">Precio:</label><input required type="number" step="0.01" class="input" name="precio" id="precio"><button type="submit" class="button is-success mt-3">Guardar</button><a href="{{url_for('juegos')}}" class="button is-primary mt-3">Volver</a></form></div></div></section>
{% endblock %}
