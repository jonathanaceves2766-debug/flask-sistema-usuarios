{% extends "maestra.html" %}
{% block titulo %} Editar juego {% endblock %}
{% block contenido %}
<section class="section"><div class="columns"><div class="column"><h3 class="is-size-3">Editar juego</h3><form action="{{url_for('actualizar_juego')}}" method="post"><input type="hidden" name="id" value="{{juego[0]}}"><label for="nombre">Nombre:</label><input value="{{juego[1]}}" required type="text" class="input" name="nombre" id="nombre"><label for="descripcion" class="mt-2">Descripción:</label><input value="{{juego[2]}}" required type="text" class="input" name="descripcion" id="descripcion"><label for="precio" class="mt-2">Precio:</label><input value="{{juego[3]}}" required type="number" step="0.01" class="input" name="precio" id="precio"><button type="submit" class="button is-success mt-3">Guardar</button><a href="{{url_for('juegos')}}" class="button is-primary mt-3">Volver</a></form></div></div></section>
{% endblock %}
